<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學測7000單字知識王</title>
    <style>
        :root { --bg: #1a1a2e; --panel: #16213e; --primary: #4ecca3; --danger: #e94560; --text: #fff; --muted: #a9a9a9; --highlight: #f9d342; --star: #ffd700; }
        body { font-family: 'Microsoft JhengHei', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh; }
        .app-container { width: 100%; max-width: 550px; background: var(--panel); border-radius: 12px; padding: 25px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); position: relative; }
        
        .nav-bar { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 2px solid #0f3460; padding-bottom: 10px; }
        .nav-btn { background: transparent; border: none; color: var(--muted); font-size: 1.1rem; font-weight: bold; cursor: pointer; padding: 10px; transition: 0.3s; }
        .nav-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .nav-btn:hover { color: var(--text); }

        .screen { display: none; flex-direction: column; }
        .screen.active { display: flex; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-box { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 1.1rem; text-align: center; background: #e0e0e0; color: #1a1a2e; font-weight: bold; }
        select.input-box { cursor: pointer; }
        
        .btn { background: var(--primary); color: #1a1a2e; border: none; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; width: 100%; margin-bottom: 15px; }
        .btn:hover { background: #45b393; transform: translateY(-2px); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-small { padding: 8px 12px; font-size: 1rem; width: auto; margin-bottom: 0; }
        
        .scoreboard { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 10px;}
        .player1-ui { color: var(--primary); }
        .player2-ui { color: var(--danger); text-align: right; }
        .round-info { text-align: center; margin-bottom: 15px; color: var(--muted); font-size: 1.1rem; }
        .question-box { background: #0f3460; padding: 30px 20px; text-align: center; font-size: 2rem; border-radius: 8px; margin-bottom: 20px; font-weight: bold; letter-spacing: 1px;}
        .timer-bar { width: 100%; height: 10px; background: #333; border-radius: 5px; margin-bottom: 10px; overflow: hidden; }
        #time-fill { height: 100%; width: 100%; background: var(--primary); transition: width 0.1s linear; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .opt-btn { background: #2a3b5c; color: white; border: none; padding: 15px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 3px solid transparent; }
        .opt-btn:hover:not(:disabled) { border-color: var(--primary); background: #3a4b6c; }
        .opt-btn:disabled { cursor: not-allowed; opacity: 0.8; }
        .correct { background: var(--primary) !important; color: #1a1a2e !important; font-weight: bold; border-color: var(--primary) !important; }
        .wrong { background: var(--danger) !important; border-color: var(--danger) !important; }
        
        .op-selected { border: 3px dashed var(--highlight) !important; box-shadow: 0 0 10px rgba(249, 211, 66, 0.5); }
        
        .vocab-list { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; margin-bottom: 15px; }
        .vocab-item { background: #0f3460; margin-bottom: 8px; padding: 12px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .vocab-text { display: flex; flex-direction: column; }
        .vocab-en { font-size: 1.2rem; font-weight: bold; color: var(--highlight); }
        .vocab-ch { font-size: 0.95rem; color: #ddd; }
        .vocab-actions { display: flex; gap: 10px; }
        .action-btn { background: transparent; border: none; font-size: 1.5rem; cursor: pointer; padding: 0; transition: transform 0.2s; }
        .action-btn:hover { transform: scale(1.2); }
        .star-active { color: var(--star); text-shadow: 0 0 8px rgba(255,215,0,0.6); }
        .star-inactive { color: #555; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .app-container { padding: 15px; }
            .nav-btn { font-size: 1rem; padding: 8px 5px; }
            .question-box { font-size: 1.6rem; padding: 20px 10px; }
            .options { grid-template-columns: 1fr; } 
            .input-group { flex-direction: column; }
            #diff-select { margin-top: 5px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="nav-bar" id="main-nav">
        <button class="nav-btn active" onclick="switchTab('screen-main', this)">🎮 對戰大廳</button>
        <button class="nav-btn" onclick="switchTab('screen-vocab', this); renderVocab();">📚 單字筆記本</button>
        <button class="nav-btn" onclick="switchTab('screen-history', this); renderHistory();">🏆 戰績</button>
    </div>

    <!-- 對戰大廳 -->
    <div id="screen-main" class="screen active">
        <div id="db-status" style="text-align:center; color:var(--highlight); margin-bottom:15px;">⏳ 題庫載入中...</div>
        
        <div class="input-group">
            <input type="text" id="player-name" class="input-box" placeholder="輸入你的暱稱" maxlength="10">
            <select id="diff-select" class="input-box">
                <option value="1">簡單 (短字)</option>
                <option value="2" selected>普通 (適中)</option>
                <option value="3">困難 (長字)</option>
            </select>
        </div>

        <button class="btn" id="btn-npc" onclick="startNpcGame()" disabled>單機練習 (vs 電腦)</button>
        
        <div style="background: #0f3460; padding: 15px; border-radius: 8px;">
            <h3 style="margin-top:0; text-align:center; color: var(--primary);">📡 遠端連線對戰</h3>
            <button class="btn btn-danger" id="btn-create" onclick="createRoom()" disabled>建立房間 (我是關主)</button>
            <div id="room-code-display" style="text-align: center; font-size: 1.5rem; color: var(--highlight); margin-bottom: 10px; display: none; font-weight:bold;"></div>
            <hr style="border-color: #333; margin: 15px 0;">
            <div class="input-group" style="margin-bottom:0;">
                <input type="text" id="room-input" class="input-box" placeholder="輸入5碼房號" maxlength="5">
                <button class="btn btn-small" id="btn-join" style="background: var(--highlight); color: black;" onclick="joinRoom()" disabled>加入房間</button>
            </div>
            <div id="lobby-status" class="status-msg" style="margin-top:10px;"></div>
        </div>
    </div>

    <!-- 遊戲進行畫面 -->
    <div id="screen-game" class="screen">
        <div class="scoreboard">
            <div class="player1-ui" id="ui-p1-name">P1<br><span id="score-p1">0</span></div>
            <div class="player2-ui" id="ui-p2-name">P2<br><span id="score-p2">0</span></div>
        </div>
        <div class="round-info" id="round-info">準備開始...</div>
        <div class="timer-bar"><div id="time-fill"></div></div>
        <div class="question-box" id="question-text">Loading...</div>
        <div class="status-msg" id="game-status" style="font-weight: bold;"></div>
        <div class="options" id="options-container"></div>
        
        <div id="result-overlay" style="display:none; text-align:center; margin-top:20px;">
            <div id="final-result" style="font-size:2rem; margin-bottom:20px; font-weight:bold; color:var(--highlight);"></div>
            <button class="btn" onclick="window.location.reload()">離開遊戲 / 回大廳</button>
        </div>
    </div>

    <!-- 單字筆記本 -->
    <div id="screen-vocab" class="screen">
        <div class="input-group">
            <input type="text" id="new-word" class="input-box" placeholder="輸入單字 (例: apple)">
            <input type="text" id="new-meaning" class="input-box" placeholder="中文解釋">
            <button class="btn btn-small" onclick="addVocab()">新增</button>
        </div>
        <ul class="vocab-list" id="vocab-list"></ul>
        <button class="btn btn-danger" onclick="clearVocab()">清空所有單字</button>
    </div>

    <!-- 對戰紀錄 -->
    <div id="screen-history" class="screen">
        <ul class="vocab-list" id="history-list"></ul>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, update, get, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4UGz3hd-WosEGuhCF3bmHs52JJOhZGts",
        authDomain: "gsat-battle-992b8.firebaseapp.com",
        databaseURL: "https://gsat-battle-992b8-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "gsat-battle-992b8",
        storageBucket: "gsat-battle-992b8.firebasestorage.app",
        messagingSenderId: "880103499727",
        appId: "1:880103499727:web:0f3540fc8e7ed7d26c14ba",
        measurementId: "G-550T1J7C40"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let database = [];
    let activeMode = '', myRole = '', currentRoomId = '';
    let currentQuestions = []; 
    let round = 0, scoreP1 = 0, scoreP2 = 0, timeLeft = 10;
    let timerInterval, npcTimeout;
    let pAnswered = false, cAnswered = false;
    let playerChoiceIndex = -1, npcChoiceIndex = -1;
    let myName = localStorage.getItem('gsat_username') || '';
    
    let currentRoomData = null; 
    let isRoundEnding = false;
    let isStarting = false;

    if(myName) document.getElementById('player-name').value = myName;
    document.getElementById('player-name').addEventListener('input', (e) => {
        myName = e.target.value.trim();
        localStorage.setItem('gsat_username', myName);
    });

    async function loadDatabase() {
        try {
            const response = await fetch('words.json');
            database = await response.json();
            document.getElementById('db-status').innerText = `✅ 題庫已就緒 (共 ${database.length} 字)`;
            document.getElementById('btn-npc').disabled = false;
            document.getElementById('btn-create').disabled = false;
            document.getElementById('btn-join').disabled = false;
        } catch (error) {
            document.getElementById('db-status').innerText = "❌ 題庫載入失敗！請確認檔案路徑。";
        }
    }
    loadDatabase();

    window.switchTab = function(screenId, btnElement) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if (btnElement) btnElement.classList.add('active'); 
        
        if (screenId !== 'screen-game') { 
            clearInterval(timerInterval); 
            clearTimeout(npcTimeout); 
        }
    };

    function getIndicesByDifficulty(targetDiff) {
        let validIndices = [];
        database.forEach((q, index) => {
            let len = q.word.length;
            if (targetDiff === 1 && len <= 5) validIndices.push(index);
            else if (targetDiff === 2 && len >= 6 && len <= 8) validIndices.push(index);
            else if (targetDiff === 3 && len >= 9) validIndices.push(index);
        });
        if (validIndices.length < 7) validIndices = database.map((_, i) => i);
        return validIndices.sort(() => Math.random() - 0.5).slice(0, 7);
    }

    function calculateScore(timeRemaining, rNum) {
        let total = 100 + Math.floor(timeRemaining * 10);
        return (rNum >= 5) ? total * 2 : total;
    }

    function checkAndSaveMistake(qObj, isWrong) {
        if (!isWrong) return;
        let vocabList = JSON.parse(localStorage.getItem('gsat_vocab')) || [];
        if (!vocabList.find(w => w.word === qObj.word)) {
            vocabList.unshift({ word: qObj.word, meaning: qObj.options[qObj.correct], star: false });
            localStorage.setItem('gsat_vocab', JSON.stringify(vocabList));
        }
    }

    // ==========================================
    // 單字筆記本系統
    // ==========================================
    window.renderVocab = function() {
        const list = document.getElementById('vocab-list');
        list.innerHTML = '';
        let vocabList = JSON.parse(localStorage.getItem('gsat_vocab')) || [];
        if (vocabList.length === 0) {
            list.innerHTML = '<li style="text-align:center; color:var(--muted); padding:20px;">筆記本是空的！對戰選錯的單字會自動出現在這。</li>';
            return;
        }
        vocabList.sort((a, b) => (a.star === b.star) ? 0 : a.star ? -1 : 1);
        vocabList.forEach((v) => {
            let li = document.createElement('li');
            li.className = 'vocab-item';
            let starClass = v.star ? 'star-active' : 'star-inactive';
            li.innerHTML = `
                <div class="vocab-text"><span class="vocab-en">${v.word}</span><span class="vocab-ch">${v.meaning}</span></div>
                <div class="vocab-actions">
                    <button class="action-btn ${starClass}" onclick="toggleStar('${v.word}')">★</button>
                    <button class="action-btn" style="color:var(--danger);" onclick="deleteVocab('${v.word}')">🗑️</button>
                </div>
            `;
            list.appendChild(li);
        });
    };

    window.addVocab = function() {
        let word = document.getElementById('new-word').value.trim();
        let meaning = document.getElementById('new-meaning').value.trim();
        if(!word || !meaning) return alert("請輸入單字與中文解釋！");
        let vocabList = JSON.parse(localStorage.getItem('gsat_vocab')) || [];
        if(!vocabList.find(w => w.word === word)) {
            vocabList.unshift({ word: word, meaning: meaning, star: true }); 
            localStorage.setItem('gsat_vocab', JSON.stringify(vocabList));
        }
        document.getElementById('new-word').value = '';
        document.getElementById('new-meaning').value = '';
        renderVocab();
    };

    window.toggleStar = function(targetWord) {
        let vocabList = JSON.parse(localStorage.getItem('gsat_vocab')) || [];
        let index = vocabList.findIndex(w => w.word === targetWord);
        if(index > -1) vocabList[index].star = !vocabList[index].star;
        localStorage.setItem('gsat_vocab', JSON.stringify(vocabList));
        renderVocab();
    };

    window.deleteVocab = function(targetWord) {
        let vocabList = JSON.parse(localStorage.getItem('gsat_vocab')) || [];
        vocabList = vocabList.filter(w => w.word !== targetWord);
        localStorage.setItem('gsat_vocab', JSON.stringify(vocabList));
        renderVocab();
    };

    window.clearVocab = function() {
        if(confirm("確定要清空整本單字筆記嗎？(此操作無法復原)")) {
            localStorage.removeItem('gsat_vocab');
            renderVocab();
        }
    };

    // ==========================================
    // 戰績清單 (修復)
    // ==========================================
    window.renderHistory = function() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        let history = JSON.parse(localStorage.getItem('gsat_history')) || [];
        if (history.length === 0) { list.innerHTML = '<li style="text-align:center; color:var(--muted); padding:20px;">尚無對戰紀錄</li>'; return; }
        
        history.forEach(h => {
            let color = h.result === "Win" ? "var(--primary)" : (h.result === "Lose" ? "var(--danger)" : "var(--muted)");
            let resultTxt = h.result === "Win" ? "勝利" : (h.result === "Lose" ? "敗北" : "平手");
            
            // 讀取對手名稱，舊版本防呆處理
            let opName = h.opponent ? h.opponent : (h.mode === "單機" ? "電腦關主" : "未知對手");
            
            let li = document.createElement('li');
            li.className = 'vocab-item';
            li.style.borderLeft = `5px solid ${color}`;
            li.innerHTML = `<div>${h.date} <br><span style="font-size:0.85rem; color:var(--muted)">[${h.mode}] vs ${opName}</span></div>
                            <div style="font-size:1.1rem">${h.pScore} : ${h.cScore} <strong style="margin-left:10px">${resultTxt}</strong></div>`;
            list.appendChild(li);
        });
    };

    // 將 opponentName 加入傳入參數與物件屬性中
    function saveHistory(resultStr, s1, s2, modeName, opponentName) {
        let history = JSON.parse(localStorage.getItem('gsat_history')) || [];
        let dateStr = new Date().toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        history.unshift({ date: dateStr, result: resultStr, pScore: s1, cScore: s2, mode: modeName, opponent: opponentName });
        if(history.length > 20) history.pop();
        localStorage.setItem('gsat_history', JSON.stringify(history));
    }

    // ==========================================
    // 模式 1：單機對戰
    // ==========================================
    window.startNpcGame = function() {
        if (!database || database.length === 0) return alert("題庫未載入！");
        myName = document.getElementById('player-name').value || '玩家';
        let diff = parseInt(document.getElementById('diff-select').value);
        
        activeMode = 'npc'; round = 0; scoreP1 = 0; scoreP2 = 0;
        document.getElementById('ui-p1-name').innerHTML = `${myName}<br><span id="score-p1">0</span>`;
        document.getElementById('ui-p2-name').innerHTML = `電腦關主<br><span id="score-p2">0</span>`;
        document.getElementById('result-overlay').style.display = 'none';
        
        let indices = getIndicesByDifficulty(diff);
        currentQuestions = indices.map(i => database[i]);
        
        document.getElementById('main-nav').style.display = 'none'; 
        switchTab('screen-game', null);
        
        document.getElementById('options-container').style.display = 'none';
        document.getElementById('game-status').innerText = "";
        document.getElementById('round-info').innerText = "準備中...";
        document.getElementById('time-fill').style.width = "100%";
        
        let countdown = 3;
        document.getElementById('question-text').innerHTML = `<span style="color:var(--highlight);">倒數 ${countdown} 秒...</span>`;
        
        let cdInterval = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                document.getElementById('question-text').innerHTML = `<span style="color:var(--highlight);">倒數 ${countdown} 秒...</span>`;
            } else {
                clearInterval(cdInterval);
                document.getElementById('options-container').style.display = 'grid';
                nextNpcRound();
            }
        }, 1000);
    };

    function nextNpcRound() {
        if (round >= 7) return endNpcGame();
        pAnswered = false; cAnswered = false; timeLeft = 10;
        playerChoiceIndex = -1; npcChoiceIndex = -1;
        document.getElementById('game-status').innerText = " ";
        let isDouble = round >= 5;
        document.getElementById('round-info').innerHTML = `第 ${round + 1} / 7 回合 ` + (isDouble ? `<span class="double-score">(雙倍積分)</span>` : "");
        
        const q = currentQuestions[round];
        document.getElementById('question-text').innerText = q.word;

        const optContainer = document.getElementById('options-container');
        optContainer.innerHTML = '';
        q.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'opt-btn'; 
            btn.innerText = opt;
            btn.id = "btn-" + idx;
            btn.onclick = () => {
                pAnswered = true;
                playerChoiceIndex = idx;
                for(let b of document.getElementsByClassName('opt-btn')) b.disabled = true;
                if (idx === q.correct) {
                    btn.classList.add('correct');
                    scoreP1 += calculateScore(timeLeft, round);
                    document.getElementById('score-p1').innerText = scoreP1;
                } else {
                    btn.classList.add('wrong');
                    checkAndSaveMistake(q, true);
                }
                checkNpcRoundEnd(false);
            };
            optContainer.appendChild(btn);
        });

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            document.getElementById('time-fill').style.width = `${(timeLeft / 10) * 100}%`;
            if (timeLeft <= 0) { timeLeft = 0; clearInterval(timerInterval); checkNpcRoundEnd(true); }
        }, 100);
        
        clearTimeout(npcTimeout);
        npcTimeout = setTimeout(() => {
            if(cAnswered || timeLeft <= 0) return;
            cAnswered = true;
            if (Math.random() < 0.75) { 
                scoreP2 += calculateScore(timeLeft, round); 
                document.getElementById('score-p2').innerText = scoreP2; 
                npcChoiceIndex = currentQuestions[round].correct;
            } else {
                let wrongIndices = [0,1,2,3].filter(i => i !== currentQuestions[round].correct);
                npcChoiceIndex = wrongIndices[Math.floor(Math.random() * wrongIndices.length)];
            }
            checkNpcRoundEnd(false);
        }, Math.random() * 5000 + 2000);
    }

    function checkNpcRoundEnd(timeOut) {
        if ((pAnswered && cAnswered) || timeOut) {
            clearInterval(timerInterval); clearTimeout(npcTimeout);
            const q = currentQuestions[round];
            
            for(let i=0; i<4; i++) {
                let btn = document.getElementById("btn-" + i);
                if (btn) {
                    btn.disabled = true;
                    if (i === q.correct) btn.classList.add('correct');
                    if (i === npcChoiceIndex && !timeOut) btn.classList.add('op-selected');
                }
            }
            
            if (playerChoiceIndex !== q.correct || timeOut) {
                document.getElementById('game-status').innerHTML = "回合結算！<span style='color:var(--danger);'>錯題已自動加入筆記本</span>";
                if (timeOut) checkAndSaveMistake(q, true);
            } else {
                document.getElementById('game-status').innerText = "回合結算！準備進入下一題...";
            }
            
            round++; setTimeout(nextNpcRound, 3000);
        } else if (pAnswered && !cAnswered) {
            document.getElementById('game-status').innerText = "等待電腦作答...";
        }
    }

    function endNpcGame() {
        if (document.getElementById('result-overlay').style.display === 'block') return; 
        document.getElementById('options-container').style.display = 'none';
        document.getElementById('question-text').innerText = "結算中...";
        document.getElementById('time-fill').style.width = "0%";
        document.getElementById('game-status').innerText = "";
        let result = scoreP1 > scoreP2 ? "Win" : (scoreP1 < scoreP2 ? "Lose" : "Draw");
        let resText = result === "Win" ? "🏆 你贏了！" : (result === "Lose" ? "💀 挑戰失敗！" : "🤝 平手！");
        document.getElementById('final-result').innerText = resText;
        document.getElementById('result-overlay').style.display = 'block';
        
        saveHistory(result, scoreP1, scoreP2, "單機", "電腦關主");
    }

    // ==========================================
    // 模式 2：連線對戰
    // ==========================================
    window.createRoom = async function() {
        myName = document.getElementById('player-name').value || '房主P1';
        let myDiff = parseInt(document.getElementById('diff-select').value);
        myRole = 'p1'; currentRoomId = Math.floor(10000 + Math.random() * 90000).toString();
        
        document.getElementById('room-code-display').innerText = `房號：${currentRoomId}`;
        document.getElementById('room-code-display').style.display = 'block';
        document.getElementById('lobby-status').innerText = "等待對手輸入房號...";

        const roomRef = ref(db, `rooms/${currentRoomId}`);
        await set(roomRef, { status: 'waiting', p1: { name: myName, score: 0, answered: false, diff: myDiff, choice: -1 }, p2: { name: '等待中...', score: 0, answered: false, diff: 2, choice: -1 }, round: 0 });
        listenToRoom();
    };

    window.joinRoom = async function() {
        myName = document.getElementById('player-name').value || '挑戰者P2';
        let myDiff = parseInt(document.getElementById('diff-select').value);
        let inputCode = document.getElementById('room-input').value;
        if (!inputCode) return alert("請輸入房號");
        
        const roomRef = ref(db, `rooms/${inputCode}`);
        const snap = await get(roomRef);
        if (snap.exists() && snap.val().status === 'waiting') {
            myRole = 'p2'; currentRoomId = inputCode;
            await update(roomRef, { status: 'ready', 'p2/name': myName, 'p2/diff': myDiff, 'p2/choice': -1 });
            listenToRoom();
        } else {
            alert("房間不存在或已開戰！");
        }
    };

    function listenToRoom() {
        const roomRef = ref(db, `rooms/${currentRoomId}`);
        onValue(roomRef, (snap) => {
            currentRoomData = snap.val(); 
            const data = currentRoomData;
            if (!data) return;

            if (myRole === 'p1' && data.status === 'ready') {
                let finalDiff = Math.round((data.p1.diff + data.p2.diff) / 2); 
                let indices = getIndicesByDifficulty(finalDiff);
                update(roomRef, { status: 'playing', q_indices: indices });
            }

            if (data.status === 'playing' && document.getElementById('screen-main').classList.contains('active')) {
                document.getElementById('ui-p1-name').innerHTML = `${data.p1.name} (P1)<br><span id="score-p1">0</span>`;
                document.getElementById('ui-p2-name').innerHTML = `${data.p2.name} (P2)<br><span id="score-p2">0</span>`;
                document.getElementById('main-nav').style.display = 'none';
                switchTab('screen-game', null);
                
                isStarting = true;
                document.getElementById('options-container').style.display = 'none';
                document.getElementById('game-status').innerText = "連線成功！";
                document.getElementById('round-info').innerText = "準備中...";
                document.getElementById('time-fill').style.width = "100%";
                
                let countdown = 3;
                document.getElementById('question-text').innerHTML = `<span style="color:var(--highlight);">倒數 ${countdown} 秒...</span>`;
                
                let cdInterval = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        document.getElementById('question-text').innerHTML = `<span style="color:var(--highlight);">倒數 ${countdown} 秒...</span>`;
                    } else {
                        clearInterval(cdInterval);
                        isStarting = false;
                        document.getElementById('options-container').style.display = 'grid';
                        renderMpQuestion(data.q_indices[data.round], data.round);
                    }
                }, 1000);
                return; 
            }

            if (data.status === 'playing' && !isStarting) {
                document.getElementById('score-p1').innerText = data.p1.score;
                document.getElementById('score-p2').innerText = data.p2.score;
                
                const curRound = document.getElementById('round-info').dataset.round;
                if (curRound != data.round) {
                    isRoundEnding = false;
                    renderMpQuestion(data.q_indices[data.round], data.round);
                }

                if (data.p1.answered && data.p2.answered) {
                    if (!isRoundEnding) {
                        isRoundEnding = true;
                        handleMpRoundEnd(data);
                    }
                } else if ((myRole === 'p1' && data.p2.answered) || (myRole === 'p2' && data.p1.answered)) {
                    document.getElementById('game-status').innerText = "對手已作答，等待中...";
                }
            }

            if (data.status === 'finished') endMpGame(data);
        });
    }

    function renderMpQuestion(qIndex, roundNum) {
        isRoundEnding = false; 
        pAnswered = false; timeLeft = 10;
        document.getElementById('round-info').innerHTML = `第 ${roundNum + 1} / 7 回合 ` + (roundNum >= 5 ? `<span class="double-score">(雙倍)</span>` : "");
        document.getElementById('round-info').dataset.round = roundNum;
        document.getElementById('game-status').innerText = "";
        
        const q = database[qIndex];
        document.getElementById('question-text').innerText = q.word;

        const optContainer = document.getElementById('options-container');
        optContainer.innerHTML = '';
        q.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'opt-btn'; 
            btn.innerText = opt;
            btn.id = "btn-" + idx;
            btn.onclick = () => submitMpAnswer(idx, qIndex, roundNum);
            optContainer.appendChild(btn);
        });

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            document.getElementById('time-fill').style.width = `${(timeLeft / 10) * 100}%`;
            if (timeLeft <= 0) { timeLeft = 0; clearInterval(timerInterval); if (!pAnswered) submitMpAnswer(-1, qIndex, roundNum); }
        }, 100);
    }

    window.submitMpAnswer = async function(selectedIndex, qIndex, roundNum) {
        if (pAnswered) return;
        pAnswered = true;
        clearInterval(timerInterval);
        for(let btn of document.getElementsByClassName('opt-btn')) btn.disabled = true;

        const q = database[qIndex];
        let scoreAdd = 0;
        if (selectedIndex === q.correct) {
            document.getElementById("btn-" + selectedIndex).classList.add('correct');
            scoreAdd = calculateScore(timeLeft, roundNum);
        } else {
            if (selectedIndex !== -1) document.getElementById("btn-" + selectedIndex).classList.add('wrong');
            checkAndSaveMistake(q, true);
        }

        document.getElementById('game-status').innerText = "已上傳，等待對手...";
        const roomRef = ref(db, `rooms/${currentRoomId}`);
        let currentScore = currentRoomData ? currentRoomData[myRole].score : 0;
        await update(roomRef, { 
            [`${myRole}/answered`]: true, 
            [`${myRole}/score`]: currentScore + scoreAdd, 
            [`${myRole}/choice`]: selectedIndex 
        });
    };

    function handleMpRoundEnd(data) {
        clearInterval(timerInterval);
        const q = database[data.q_indices[data.round]];
        let opRole = myRole === 'p1' ? 'p2' : 'p1';
        let opChoice = data[opRole].choice;
        let myChoice = data[myRole].choice;
        
        for(let i=0; i<4; i++) {
            let btn = document.getElementById("btn-" + i);
            if (btn) {
                if (i === q.correct) btn.classList.add('correct');
                if (i === opChoice && opChoice !== -1) btn.classList.add('op-selected');
            }
        }
        
        if (myChoice !== q.correct) {
            document.getElementById('game-status').innerHTML = "回合結算！<span style='color:var(--danger);'>錯題已自動加入筆記本</span>";
        } else {
            document.getElementById('game-status').innerText = "回合結算！準備進入下一題...";
        }

        if (myRole === 'p1') {
            setTimeout(() => {
                if (data.round >= 6) update(ref(db, `rooms/${currentRoomId}`), { status: 'finished' });
                else update(ref(db, `rooms/${currentRoomId}`), { round: data.round + 1, "p1/answered": false, "p2/answered": false, "p1/choice": -1, "p2/choice": -1 });
            }, 3000);
        }
    }

    function endMpGame(data) {
        if (document.getElementById('result-overlay').style.display === 'block') return; 
        document.getElementById('options-container').style.display = 'none';
        document.getElementById('question-text').innerText = "遊戲結算";
        document.getElementById('time-fill').style.width = "0%";
        document.getElementById('game-status').innerText = "";
        
        let myScore = data[myRole].score;
        let opRole = myRole === 'p1' ? 'p2' : 'p1';
        let opScore = data[opRole].score;
        let opName = data[opRole].name;
        
        let result = myScore > opScore ? "Win" : (myScore < opScore ? "Lose" : "Draw");
        let resText = result === "Win" ? "🏆 你贏了！" : (result === "Lose" ? `💀 敗給了 ${opName}` : "🤝 平手！");
        
        document.getElementById('final-result').innerText = resText;
        document.getElementById('result-overlay').style.display = 'block';
        
        saveHistory(result, myScore, opScore, "連線", opName);
    }
</script>
</body>
</html>
